# Portal behind Caddy (automatic HTTPS). Run from the opsengine-v0 folder:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/production.env up -d
services:
  opsengine:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: production.env
    volumes:
      - opsengine-state:/app/state                 # databases, evidence, messages (encrypted disk)
      - ../data/customers:/app/data/customers      # customer folders (never in git)
      - opsengine-backups:/backups                 # nightly backups (move off-host too)
      - opsengine-checkpoints:/checkpoints         # signed audit checkpoints (copy off-host)
    expose: ["8000"]
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [opsengine]
volumes:
  opsengine-state: {}
  opsengine-backups: {}
  opsengine-checkpoints: {}
  caddy-data: {}
