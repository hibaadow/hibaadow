[project]
name = "atlas-ai"
version = "1.0.0"
description = "ATLAS AI — autonomous crypto day-trading agent (paper trading by default)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 150
